name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Project Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Install Capacitor CLI and Android Platform
        run: |
          npm install --legacy-peer-deps --no-save @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0

      - name: Build Web Application
        run: npm run build

      - name: Initialize Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Apply Custom Cassette App Icon and Branding to Android APK
        run: |
          # Install ffmpeg for fast high-quality icon downscaling
          sudo apt-get update && sudo apt-get install -y ffmpeg || true
          
          # Target Android mipmap directories
          MIPMAP="android/app/src/main/res"
          mkdir -p $MIPMAP/mipmap-mdpi
          mkdir -p $MIPMAP/mipmap-hdpi
          mkdir -p $MIPMAP/mipmap-xhdpi
          mkdir -p $MIPMAP/mipmap-xxhdpi
          mkdir -p $MIPMAP/mipmap-xxxhdpi
          
          # Generate icons for all standard Android screen densities from app-icon.png
          ffmpeg -i public/app-icon.png -vf "scale=48:48" $MIPMAP/mipmap-mdpi/ic_launcher.png -y || cp public/app-icon.png $MIPMAP/mipmap-mdpi/ic_launcher.png
          ffmpeg -i public/app-icon.png -vf "scale=72:72" $MIPMAP/mipmap-hdpi/ic_launcher.png -y || cp public/app-icon.png $MIPMAP/mipmap-hdpi/ic_launcher.png
          ffmpeg -i public/app-icon.png -vf "scale=96:96" $MIPMAP/mipmap-xhdpi/ic_launcher.png -y || cp public/app-icon.png $MIPMAP/mipmap-xhdpi/ic_launcher.png
          ffmpeg -i public/app-icon.png -vf "scale=144:144" $MIPMAP/mipmap-xxhdpi/ic_launcher.png -y || cp public/app-icon.png $MIPMAP/mipmap-xxhdpi/ic_launcher.png
          ffmpeg -i public/app-icon.png -vf "scale=192:192" $MIPMAP/mipmap-xxxhdpi/ic_launcher.png -y || cp public/app-icon.png $MIPMAP/mipmap-xxxhdpi/ic_launcher.png
          
          # Round launcher icons
          cp $MIPMAP/mipmap-mdpi/ic_launcher.png $MIPMAP/mipmap-mdpi/ic_launcher_round.png
          cp $MIPMAP/mipmap-hdpi/ic_launcher.png $MIPMAP/mipmap-hdpi/ic_launcher_round.png
          cp $MIPMAP/mipmap-xhdpi/ic_launcher.png $MIPMAP/mipmap-xhdpi/ic_launcher_round.png
          cp $MIPMAP/mipmap-xxhdpi/ic_launcher.png $MIPMAP/mipmap-xxhdpi/ic_launcher_round.png
          cp $MIPMAP/mipmap-xxxhdpi/ic_launcher.png $MIPMAP/mipmap-xxxhdpi/ic_launcher_round.png
          
          # Foreground adaptive icons
          cp $MIPMAP/mipmap-mdpi/ic_launcher.png $MIPMAP/mipmap-mdpi/ic_launcher_foreground.png
          cp $MIPMAP/mipmap-hdpi/ic_launcher.png $MIPMAP/mipmap-hdpi/ic_launcher_foreground.png
          cp $MIPMAP/mipmap-xhdpi/ic_launcher.png $MIPMAP/mipmap-xhdpi/ic_launcher_foreground.png
          cp $MIPMAP/mipmap-xxhdpi/ic_launcher.png $MIPMAP/mipmap-xxhdpi/ic_launcher_foreground.png
          cp $MIPMAP/mipmap-xxxhdpi/ic_launcher.png $MIPMAP/mipmap-xxxhdpi/ic_launcher_foreground.png
          
          # Update strings.xml with app title
          STRINGS="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS" ]; then
            sed -i 's|<string name="app_name">.*</string>|<string name="app_name">MixCasete</string>|' "$STRINGS" || true
            sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">YouTube Cassette Player</string>|' "$STRINGS" || true
          fi

      - name: Configure Android Permissions and Landscape Orientation
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # Grant Internet and Network permissions
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />' "$MANIFEST"
            # Ensure landscape / sensorLandscape orientation support
            sed -i 's/android:screenOrientation="[^"]*"/android:screenOrientation="sensorLandscape"/' "$MANIFEST" || true
          fi

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p build-output
          APK_PATH=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" build-output/YouTube-Cassette-Player-debug.apk
            echo "APK ready at build-output/YouTube-Cassette-Player-debug.apk"
          else
            echo "Error: APK not found"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Cassette-Player-APK
          path: build-output/YouTube-Cassette-Player-debug.apk
          retention-days: 30
